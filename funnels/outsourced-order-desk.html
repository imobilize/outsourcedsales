<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg:#FFFFFF;--surface:#F5F5F7;--ink:#1D1D1F;--muted:#6E6E73;--accent:#1D1D1F;--accent-ink:#1D1D1F;--on-accent:#FFFFFF;--dark:#000000;--on-dark:#F5F5F7;
  --em:#86868B;--em-style:normal;--head:-apple-system,BlinkMacSystemFont,"Inter Tight",sans-serif;--body:-apple-system,BlinkMacSystemFont,"Inter Tight",sans-serif;--hw:700;--track:-.04em;--r:22px;--br:999px;
  --line:color-mix(in srgb,var(--ink) 10%,transparent);--line2:color-mix(in srgb,var(--ink) 16%,transparent);
  --soft:color-mix(in srgb,var(--ink) 4%,var(--bg));--accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --maxw:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body),-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
.h{font-family:var(--head),-apple-system,sans-serif;font-weight:var(--hw);letter-spacing:var(--track);line-height:1.04;margin:0}
.h em{font-style:var(--em-style);color:var(--em)}
body[data-style="luxury"] .h em{font-weight:400}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.narrow{max-width:760px;margin:0 auto;padding:0 28px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;font-size:17px;border-radius:var(--br);padding:19px 30px;border:0;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:hover{transform:translateY(-1px);box-shadow:0 16px 40px color-mix(in srgb,var(--accent) 34%,transparent)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.cta-note{font-size:13.5px;color:var(--muted);margin-top:12px;display:flex;gap:14px;flex-wrap:wrap}
.cta-note span:before{content:"\2713";color:var(--accent-ink);font-weight:800;margin-right:6px}
.proof-slot{border:1.5px dashed var(--line2);border-radius:calc(var(--r) * .7);padding:14px 16px;color:var(--muted);font-size:14px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
section.s{padding:104px 0}
.s-head{max-width:760px;margin-bottom:46px}
.s-head .h{font-size:clamp(34px,4.6vw,56px)}
.s-head p{font-size:19px;color:var(--muted);margin:18px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.dark{background:var(--dark);color:var(--on-dark)}
.dark .muted,.dark .s-head p{color:color-mix(in srgb,var(--on-dark) 72%,transparent)}
.dark .h em{color:color-mix(in srgb,var(--on-dark) 58%,transparent)}
body[data-style="bold"] .dark .h em,body[data-style="bold"] .h em{color:var(--em)}
body[data-style="luxury"] .dark .h em{color:color-mix(in srgb,var(--on-dark) 75%,var(--accent-ink))}
.dark .card{background:color-mix(in srgb,var(--on-dark) 6%,transparent);border-color:color-mix(in srgb,var(--on-dark) 12%,transparent)}
.dark .eyebrow{color:color-mix(in srgb,var(--on-dark) 70%,var(--accent))}

/* Preview switcher (hidden when a page is locked) */
.switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:4px;background:rgba(20,18,16,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:5px;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.switch button{appearance:none;border:0;background:transparent;color:#d9d3c7;font:600 13px -apple-system,"Segoe UI",sans-serif;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switch button.on{background:#fff;color:#111}
.page{display:none}.page.on{display:block}

/* Announcement + nav */
.announce{background:var(--dark);color:var(--on-dark);text-align:center;font-size:14px;font-weight:600;padding:10px 16px}
.nav{display:flex;align-items:center;gap:12px;padding:22px 0}
.mark{width:36px;height:36px;border-radius:calc(var(--r) * .55);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--head),sans-serif;font-weight:800;font-size:17px;letter-spacing:-.03em}
.nav .nm{font-family:var(--head),sans-serif;font-weight:var(--hw);font-size:19px;letter-spacing:var(--track)}
.nav .sp{flex:1}
.nav .lk{font-size:14px;color:var(--muted);text-decoration:none;margin-left:20px}

/* Hero */
.hero{padding:40px 0 96px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:64px;align-items:center}
.hero .h{font-size:clamp(44px,6.4vw,84px);margin-bottom:24px}
.hero .sub{font-size:20px;color:var(--muted);max-width:40ch;margin:0 0 34px}
.hero .proofline{margin-top:30px;display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.hero .proofline b{color:var(--ink);font-size:22px;display:block;font-family:var(--head),sans-serif;letter-spacing:-.02em}
.vsl{aspect-ratio:16/9;width:100%;border:0;border-radius:var(--r);background:#000;box-shadow:0 30px 80px rgba(0,0,0,.18)}

/* Product shot */
.shot{position:relative}
.device{background:var(--surface);border-radius:calc(var(--r) * 1.4);box-shadow:0 40px 100px color-mix(in srgb,var(--ink) 18%,transparent),0 2px 8px color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--line);overflow:hidden;transform:rotate(-1.2deg)}
.device .top{background:var(--dark);color:var(--on-dark);padding:26px 26px 22px;position:relative;overflow:hidden}
.device .top:after{content:"";position:absolute;right:-60px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 70%,transparent),transparent);opacity:.7}
.device .top .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:700}
.device .top .h{font-size:28px;margin-top:10px;position:relative;z-index:1;max-width:14ch}
.device .top .h em{color:inherit}
.device ol{list-style:none;margin:0;padding:10px 0}
.device li{display:flex;align-items:center;gap:14px;padding:11px 22px;font-size:14.5px;font-weight:600}
.device li .n{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--muted);flex:0 0 26px}
.device li .t{flex:1;line-height:1.3}
.device li .d{font-size:12px;color:var(--muted);font-weight:500}
.device li:first-child .n{background:var(--accent);color:var(--on-accent)}
.float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 20px 50px color-mix(in srgb,var(--ink) 16%,transparent);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px}
.float .dot{width:9px;height:9px;border-radius:50%;background:#22a05a;box-shadow:0 0 0 4px rgba(34,160,90,.15)}
.float.f1{left:-28px;bottom:42px}
.float.f2{right:-18px;top:-18px}
.float.f2 b{font-family:var(--head),sans-serif;font-size:20px;letter-spacing:-.02em}

/* the product card title must not inherit the hero headline size */
.hero .shot .device .top .h{font-size:clamp(24px,2.4vw,32px)!important;line-height:1.05!important;max-width:15ch}

/* Proof strip */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0}
.strip .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.strip .it{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.strip .it:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Pain */
.pains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pains .card .h{font-size:22px;margin-bottom:10px;letter-spacing:-.02em}
.pains .card p{margin:0;color:var(--muted);font-size:16px}
.pains .card .q{font-family:var(--head);font-style:var(--em-style);font-weight:600;letter-spacing:-.02em;font-size:21px;line-height:1.3;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink)}

/* Graveyard */
.grave{display:grid;gap:0;border-top:1px solid color-mix(in srgb,var(--on-dark) 14%,transparent)}
.grave .row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.3fr);gap:24px;padding:26px 0;border-bottom:1px solid color-mix(in srgb,var(--on-dark) 14%,transparent);align-items:baseline}
.grave .x{font-size:20px;opacity:.5}
.grave .t{font-family:var(--head),sans-serif;font-weight:var(--hw);font-size:24px;letter-spacing:-.02em;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--accent) 80%,transparent);text-decoration-thickness:2px}
.grave .w{color:color-mix(in srgb,var(--on-dark) 75%,transparent)}
.turn{font-size:clamp(28px,3.6vw,44px);margin-top:56px;max-width:22ch}

/* Mechanism */
.mech{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
.mech .steps{display:grid;gap:14px}
.mech .st{display:grid;grid-template-columns:54px minmax(0,1fr);gap:18px;align-items:start}
.mech .st .n{width:54px;height:54px;border-radius:calc(var(--r) * .8);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--head),sans-serif;font-weight:800;font-size:20px}
.mech .st .h{font-size:22px;margin:4px 0 6px;letter-spacing:-.02em}
.mech .st p{margin:0;color:var(--muted)}

/* Inside */
.inside{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:start}
.lessons{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.lesson .n{font-family:var(--head),sans-serif;font-weight:800;font-size:15px;color:var(--accent-ink)}
.lesson .t{font-weight:700;font-size:17px;line-height:1.3}
.lesson .d{font-size:14.5px;color:var(--muted)}
.stack{position:sticky;top:24px}
.stack ul{list-style:none;margin:0 0 20px;padding:0}
.stack li{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.stack li b{font-weight:700}
.stack li span{color:var(--muted);white-space:nowrap}
.pricebox{text-align:center;padding:8px 0 4px}
.pricebox .was{font-size:15px;color:var(--muted)}
.pricebox .was s{margin-left:6px}
.pricebox .now{font-family:var(--head),sans-serif;font-weight:800;font-size:76px;letter-spacing:-.05em;line-height:1;margin:6px 0 4px}
.pricebox .once{font-size:13px;color:var(--muted);margin-bottom:20px}

/* For / not for */
.fit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fit ul{list-style:none;margin:0;padding:0}
.fit li{padding:14px 0 14px 36px;border-top:1px solid var(--line);position:relative}
.fit li:first-child{border-top:0}
.fit li:before{position:absolute;left:0;top:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.fit .yes li:before{content:"\2713";background:var(--accent-soft);color:var(--accent-ink)}
.fit .no li:before{content:"\2715";background:var(--soft);color:var(--muted)}
.fit .h{font-size:24px;margin-bottom:10px}

/* Testimonials */
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.test .q{font-family:var(--head);font-style:var(--em-style);font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.3;margin:0 0 18px}
.test .who{font-size:14px;font-weight:700}
.test .res{font-size:13px;color:var(--accent-ink);font-weight:700;margin-top:2px}

/* Founder */
.founder{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:center}
.photo.has-img{padding:0;overflow:hidden;display:block}
.photo.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.photo{aspect-ratio:4/5;border-radius:calc(var(--r) * 1.3);background:linear-gradient(160deg,var(--soft),color-mix(in srgb,var(--accent) 16%,var(--bg)));display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:30px;border:1px solid var(--line)}
.founder .story p{font-size:18.5px;margin:0 0 16px}
.founder .sig{font-family:var(--head);font-style:var(--em-style);font-weight:600;letter-spacing:-.02em;font-size:30px;margin-top:10px}

/* Guarantee */
.guar{display:grid;grid-template-columns:120px minmax(0,1fr);gap:32px;align-items:center;max-width:860px;margin:0 auto}
.seal{width:120px;height:120px;border-radius:50%;border:2px solid var(--accent-ink);display:grid;place-items:center;text-align:center;font-family:var(--head),sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;line-height:1.25;color:var(--accent-ink);box-shadow:0 0 0 8px var(--accent-soft)}
.guar .h{font-size:clamp(26px,3vw,36px);margin-bottom:10px}
.guar p{margin:0;font-size:18px;color:var(--muted)}

/* FAQ */
.faq{max-width:820px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:24px 0;font-family:var(--head),sans-serif;font-weight:700;font-size:20px;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-size:26px;font-weight:400;transition:transform .2s ease;color:var(--muted)}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq details p{margin:0 0 24px;color:var(--muted);font-size:17.5px;max-width:64ch}

/* Final */
.final{text-align:center}
.final .h{font-size:clamp(40px,5.6vw,72px);max-width:16ch;margin:0 auto 22px}
.final p{font-size:20px;max-width:46ch;margin:0 auto 36px}
.final .cta-note{justify-content:center}
.foot{padding:40px 0 90px;font-size:12.5px;color:var(--muted)}
.foot .wrap{display:grid;gap:10px}

/* ---------- Checkout ---------- */
.co{min-height:100vh;padding:40px 0 100px}
.co-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:start;margin-top:30px}
.steps-bar{display:flex;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.steps-bar span{display:flex;align-items:center;gap:8px}
.steps-bar span i{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:11px}
.steps-bar span.on{color:var(--ink)}
.steps-bar span.on i{background:var(--accent);color:var(--on-accent)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line2);background:var(--surface);border-radius:calc(var(--r) * .65);padding:15px 16px;font:500 16px var(--body),sans-serif;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bump{border:2px dashed var(--accent);border-radius:var(--r);padding:20px;margin:22px 0;background:var(--accent-soft)}
.bump label{display:flex;gap:12px;align-items:flex-start;font-weight:800;font-size:16.5px;cursor:pointer}
.bump input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:0 0 22px}
.bump p{margin:10px 0 0 34px;font-size:15px;color:var(--muted)}
.bump .tag{display:inline-block;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-bottom:10px}
.summary .item{display:flex;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.summary .thumb{width:62px;height:62px;border-radius:calc(var(--r) * .7);background:var(--dark);color:var(--on-dark);display:grid;place-items:center;font-family:var(--head),sans-serif;font-weight:800;font-size:22px;flex:0 0 62px}
.summary .line{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
.summary .tot{display:flex;justify-content:space-between;font-family:var(--head),sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;padding-top:14px;margin-top:8px;border-top:1px solid var(--line)}
.summary ul{list-style:none;margin:18px 0 0;padding:0}
.summary ul li{font-size:14.5px;padding:6px 0 6px 26px;position:relative}
.summary ul li:before{content:"\2713";position:absolute;left:0;color:var(--accent-ink);font-weight:800}
.secure{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}

/* ---------- Upsell ---------- */
.up{min-height:100vh;padding:28px 0 100px}
.progress{max-width:560px;margin:0 auto 46px;text-align:center}
.progress .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.progress .bar i{display:block;height:100%;width:80%;background:var(--accent);border-radius:99px}
.progress .k{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.up .h.big{font-size:clamp(38px,5.4vw,66px);text-align:center;max-width:17ch;margin:0 auto 20px}
.up .sub{text-align:center;font-size:20px;color:var(--muted);max-width:46ch;margin:0 auto 46px}
.up-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;max-width:960px;margin:0 auto;align-items:start}
.up ul{list-style:none;margin:0;padding:0}
.up ul li{padding:14px 0 14px 34px;border-bottom:1px solid var(--line);position:relative;font-size:16.5px}
.up ul li:before{content:"\2713";position:absolute;left:0;top:14px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.decline{display:block;text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}

/* ---------- Thank you ---------- */
.ty{padding:28px 0 100px}
.ty-hero{text-align:center;max-width:860px;margin:0 auto 40px}
.ty-hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;margin-bottom:22px}
.ty-hero .h{font-size:clamp(40px,5.6vw,70px);margin-bottom:18px}
.ty-hero p{font-size:20px;color:var(--muted);margin:0}
.video{max-width:860px;margin:0 auto 18px;aspect-ratio:16/9;border-radius:calc(var(--r) * 1.2);background:var(--dark);color:var(--on-dark);display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;box-shadow:0 40px 100px color-mix(in srgb,var(--ink) 22%,transparent)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{width:84px;height:84px;border-radius:50%;background:var(--on-dark);color:var(--dark);display:grid;place-items:center;font-size:26px;margin:0 auto 16px;padding-left:5px}
.video .cap{font-size:14px;opacity:.75}
.script{max-width:860px;margin:0 auto 64px}
.script summary{cursor:pointer;font-size:14px;color:var(--muted);text-align:center;list-style:none}
.script summary::-webkit-details-marker{display:none}
.script ol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px 20px 46px;margin:14px 0 0;font-size:15.5px}
.script li{margin:6px 0}
.ty-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1000px;margin:0 auto 64px}
.ty-steps .card .n{font-family:var(--head),sans-serif;font-weight:800;font-size:15px;color:var(--accent-ink);margin-bottom:10px}
.ty-steps .card .h{font-size:21px;margin-bottom:8px;letter-spacing:-.02em}
.ty-steps .card p{margin:0;color:var(--muted);font-size:15.5px}
.book{max-width:1000px;margin:0 auto;border-radius:calc(var(--r) * 1.4);overflow:hidden;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.book .l{padding:44px}

  /* ---- SALES ---- */

    var G = S.graveyard || {};
    if (arr(G.items).length) h += '<section class="dr-sec dark"><div class="wrap"><div class="dr-head"><h2 class="h">' + t(G.title_display || G.title) + '</h2></div><div class="dr-grave">' +
      arr(G.items).map(function(x){ x = obj(x, "tried"); return '<div class="row">' + I.x + '<span class="t">' + esc(x.tried) + '</span><span class="w">' + esc(x.why_failed) + '</span></div>'; }).join("") + '</div>' +

    if (O.guarantee) h += '<section class="dr-sec"><div class="wrap"><div class="dr-guar"><span class="seal2">' + sealTxt + '</span><div><h2 class="h">' + t(S.guarantee_title_display || (gDays ? "Zero risk. *Seriously.*" : "We’ll help you *get it working.*")) + '</h2><p>' + esc(O.guarantee) + '</p></div></div></div></section>';
    if (arr(S.faq).length) h += '<section class="dr-sec soft" id="faq"><div class="wrap"><div class="dr-head"><h2 class="h">Questions, answered</h2></div><div class="dr-faq">' + arr(S.faq).map(faqItem).filter(function(f){ return f.q; }).map(function(f){ return '<details><summary>' + esc(f.q) + '</summary><p>' + esc(f.a) + '</p></details>'; }).join("") + '</div></div></section>';

  }

  /* ---- CHECKOUT ---- */

      '<label class="field"><span>Full name</span><input placeholder="Your name"></label><label class="field"><span>Email</span><input placeholder="you@email.com" type="email"></label>' +
      '<label class="field"><span>Card</span><input placeholder="1234 1234 1234 1234"></label><div class="row2"><label class="field"><span>Expiry</span><input placeholder="MM / YY"></label><label class="field"><span>CVC</span><input placeholder="123"></label></div>' +
      (bump.name ? '<div class="bump"><span class="tag">' + esc(bump.tag || "One-time add-on") + '</span><label><input type="checkbox" id="bump"> ' + esc(bump.checkbox_label || ("Yes, add " + bump.name + " for " + cur + bump.price)) + '</label><p>' + esc(bump.pitch || "") + '</p></div>' : '') +
      '<a class="btn block" href="' + esc(link(L.upsell) || "#upsell") + '" id="pay">' + esc(C.cta || ("Complete order · " + cur + price)) + '</a><div class="secure">' + esc(C.secure_note || ("Secure checkout · Instant access" + (gDays ? " · " + gDays + "-day money-back guarantee" : ""))) + '</div>' +
      '<p class="muted" style="font-size:12.5px;margin-top:22px">Preview only. Your real checkout runs on Stripe, GoHighLevel or your checkout tool, using this copy.</p></div>' +
      '<div class="card summary"><div class="item"><span class="thumb">' + mark + '</span><div><b>' + esc(O.name) + '</b><div class="muted" style="font-size:14px">' + lessons.length + ' lessons · instant access</div></div></div>' +
      '<div class="line"><span>' + esc(O.name) + '</span><span>' + esc(cur) + price + '</span></div>' + (bump.name ? '<div class="line" id="bline" style="display:none"><span>' + esc(bump.name) + '</span><span>' + esc(cur) + esc(bump.price) + '</span></div>' : '') +
      '<div class="tot"><span>Total</span><span id="tot">' + esc(cur) + price + '</span></div><ul>' + arr(C.bullets).map(function(b){ return '<li>' + esc(txt(b)) + '</li>'; }).join("") + '</ul></div></div></div></section>';
  }

  /* ---- UPSELL ---- */
  function upsell(){
    if (!U.headline) return '<div class="wrap" style="padding:80px 28px"><p class="muted">No upsell set for this funnel.</p></div>';
    return nav(false) + '<section class="up"><div class="wrap"><div class="progress"><div class="k">' + esc(U.progress || "Wait, your order isn’t quite finished") + '</div><div class="bar"><i></i></div></div>' +
      (U.eyebrow ? '<div class="eyebrow" style="text-align:center">' + esc(U.eyebrow) + '</div>' : '') + '<h1 class="h big">' + t(U.headline_display || U.headline) + '</h1><p class="sub">' + esc(U.sub || "") + '</p>' +
      '<div class="dr-vsl" style="max-width:760px;margin:30px auto 40px">' + (link(L.upsell_video_embed) ? '<iframe src="' + esc(link(L.upsell_video_embed)) + '" allow="autoplay; fullscreen" allowfullscreen title="Watch the video"></iframe>' : '<div class="poster"><div class="play">' + I.play + '</div><div class="cap">Your OTO video plays here</div></div>') + '</div>' +
      '<div class="up-grid"><div class="card"><ul>' + arr(U.bullets).map(function(b){ return '<li>' + esc(txt(b)) + '</li>'; }).join("") + '</ul>' + (U.why ? '<p class="muted" style="margin:18px 0 0;font-size:15px">' + esc(U.why) + '</p>' : '') + '</div>' +
      '<div class="card" style="text-align:center"><div class="muted" style="font-size:14px">One-time offer · only on this page</div><div class="pricebox"><div class="was">' + (U.was_price ? 'Was<s>' + esc(cur) + esc(U.was_price) + '</s>' : '&nbsp;') + '</div><div class="now">' + esc(cur) + esc(U.price) + '</div><div class="once">Added to your order with one click</div></div>' +
      '<a class="btn block" href="' + esc(link(L.upsell_yes) || "#thanks") + '">' + esc(U.cta_yes || "Yes, add it to my order") + '</a><a class="decline" href="' + esc(link(L.upsell_no) || "#thanks") + '">' + esc(U.cta_no || "No thanks, I’ll go without") + '</a></div></div></div></section>';
  }

  /* ---- THANK YOU ---- */
  function thanks(){
    var call = T.call || {}, hrs = Number(call.window_hours) || 72;
    var video = link(L.welcome_video_embed) ? '<div class="video"><iframe src="' + esc(link(L.welcome_video_embed)) + '" allow="autoplay; fullscreen" allowfullscreen title="Welcome video"></iframe></div>' :
      '<div class="video"><div><div class="play">▶</div><div class="cap">' + esc(T.video_caption || "Your book-a-call video plays here") + '</div></div></div>';
    var bookEmbed = link(L.booking_embed), bookUrl = link(L.booking);
    var calGrid = '<div class="grid">' + Array.apply(null, {length:28}).map(function(_, i){ return '<i' + ([9,11,16,18,23].indexOf(i) > -1 ? ' class="a"' : '') + '></i>'; }).join("") + '</div>';
    var cal = bookEmbed ? '<iframe src="' + esc(bookEmbed) + '" title="Book your call"></iframe>' :
      bookUrl ? '<div class="cal-ph"><div>' + calGrid + '<b>Pick a time that suits you</b><div class="muted" style="font-size:14px;margin:6px 0 22px">Your booking calendar opens in a new tab.</div><a class="btn" href="' + esc(bookUrl) + '" target="_blank" rel="noopener">' + esc(call.button || "Book your call") + ' →</a></div></div>' :
      '<div class="cal-ph"><div>' + calGrid + '<b>Your booking calendar goes here</b><div class="muted" style="font-size:14px;margin-top:6px">Paste your Calendly or GoHighLevel booking link into <code>links.booking</code>, or its embed link into <code>links.booking_embed</code></div></div></div>';
    return nav(false) + '<section class="ty"><div class="wrap"><div class="ty-hero"><span class="badge">✓ ' + esc(T.badge || "Order confirmed") + '</span><h1 class="h">' + t(T.headline_display || T.headline || "You’re in.") + '</h1><p>' + esc(T.sub || "") + '</p></div>' +
      video + (arr(T.video_script).length ? '<details class="script"><summary>Read the video script ↓</summary><ol>' + arr(T.video_script).map(function(x){ return '<li>' + esc(txt(x)) + '</li>'; }).join("") + '</ol></details>' : '<div style="height:48px"></div>') +
      (arr(T.steps).length ? '<div class="ty-steps">' + arr(T.steps).map(function(s, i){ s = obj(s, "h"); return '<div class="card"><div class="n">Step ' + (i + 1) + '</div><h3 class="h">' + esc(s.h) + '</h3><p>' + esc(s.p) + '</p></div>'; }).join("") + '</div>' : '') +
      '<div class="book dark"><div class="l"><div class="eyebrow">' + esc(call.eyebrow || "Only for new members") + '</div><h2 class="h">' + t(call.name_display || call.name || "Book your call") + '</h2><p class="muted">' + esc(call.promise || "") + '</p>' +
      '<div class="timer" id="timer"><div><b id="th">' + hrs + '</b><span>hours</span></div><div><b id="tm">00</b><span>mins</span></div><div><b id="ts">00</b><span>secs</span></div></div>' +
      (arr(T.prep).length ? '<div class="eyebrow" style="margin-bottom:8px">Before the call</div><ul class="prep">' + arr(T.prep).map(function(p){ return '<li>' + esc(txt(p)) + '</li>'; }).join("") + '</ul>' : '') + '</div><div class="r">' + cal + '</div></div>' +
      (T.proof && T.proof.quote && !proof(T.proof.quote) ? '<div class="ty-proof"><p class="q">“' + esc(T.proof.quote) + '”</p><div class="muted">' + esc(T.proof.who || "") + '</div></div>' : '') +
      '<div style="text-align:center;margin-top:56px"><a class="btn ghost" href="' + esc(link(L.access) || "#") + '">' + esc(T.access_cta || "Go to your lessons") + ' →</a></div></div></section>';
  }

  /* ---- Mount ---- */
  var PAGES = [["sales", "Sales page", sales], ["checkout", "Checkout", checkout], ["upsell", "Upsell", upsell], ["thanks", "Thank-you", thanks]];
  var root = document.getElementById("pages"), sw = document.getElementById("switch");
  root.innerHTML = PAGES.map(function(p){ var h; try { h = p[2](); } catch(e) { h = '<p style="padding:40px">This page could not render: ' + esc(e.message) + '</p>'; } return '<div class="page" id="p-' + p[0] + '">' + h + '</div>'; }).join("");
  var qp = null; try { qp = new URLSearchParams(location.search).get("page"); } catch(e) {}
  var want = qp || D.page; var lock = want && PAGES.some(function(p){ return p[0] === want; }) ? want : null;
  function show(id){
    PAGES.forEach(function(p){ document.getElementById("p-" + p[0]).classList.toggle("on", p[0] === id); });
    sw.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-p") === id); });
    document.title = (PAGES.filter(function(p){ return p[0] === id; })[0] || PAGES[0])[1] + " · " + (O.name || BR.name || "Funnel");
    window.scrollTo(0, 0);
  }
  if (lock) { sw.remove(); show(lock); }
  else {
    sw.innerHTML = PAGES.map(function(p){ return '<button data-p="' + p[0] + '">' + p[1] + '</button>'; }).join("");
    sw.addEventListener("click", function(e){ var b = e.target.closest("button"); if (b) { history.replaceState(null, "", "#" + b.getAttribute("data-p")); show(b.getAttribute("data-p")); } });
    var start = (location.hash || "").replace("#", ""); show(PAGES.some(function(p){ return p[0] === start; }) ? start : "sales");
    document.addEventListener("click", function(e){ var a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a) return; var id = a.getAttribute("href").slice(1); if (PAGES.some(function(p){ return p[0] === id; })) { e.preventDefault(); history.replaceState(null, "", "#" + id); show(id); } });
  }

  /* Bump total */
  var bx = document.getElementById("bump");
  if (bx) bx.addEventListener("change", function(){ var bp = Number((C.bump || {}).price) || 0, base = Number(O.price) || 0; document.getElementById("bline").style.display = bx.checked ? "flex" : "none"; document.getElementById("tot").textContent = cur + (base + (bx.checked ? bp : 0)); });

  /* 72-hour window. Uses the real purchase time if the checkout passes ?purchased=<ISO date or ms>,
     else the first visit saved in this browser. If neither is known, show a static line, never a resetting timer. */
  var hrs = Number((T.call || {}).window_hours) || 72, key = "ce_ty_start_" + (BR.name || "funnel"), start = 0;
  try { var pq = new URLSearchParams(location.search).get("purchased"); if (pq) start = isNaN(Number(pq)) ? Date.parse(pq) : Number(pq); } catch(e) {}
  if (!(start > 0)) { try { var s0 = Number(localStorage.getItem(key)); if (s0 > 0) start = s0; else { localStorage.setItem(key, String(Date.now())); if (Number(localStorage.getItem(key)) > 0) start = Number(localStorage.getItem(key)); } } catch(e) {} }
  var timer = document.getElementById("timer");
  if (!(start > 0) && timer) { timer.outerHTML = '<p class="muted" style="margin:18px 0 22px;font-weight:600">Open for ' + hrs + ' hours after you buy.</p>'; }
  function tick(){
    var th = document.getElementById("th"); if (!th || !(start > 0)) return;
    var left = Math.max(0, start + hrs * 3600e3 - Date.now()), h = Math.floor(left / 3600e3), m = Math.floor(left % 3600e3 / 60e3), s = Math.floor(left % 60e3 / 1e3);
    th.textContent = h; document.getElementById("tm").textContent = String(m).padStart(2, "0"); document.getElementById("ts").textContent = String(s).padStart(2, "0");
  }
  tick(); setInterval(tick, 1000);

  /* Optional Meta pixel: PageView on every page. Purchase should come from the checkout / Conversions API, not here,
     unless tracking.thanks_event is set on purpose. */
  var TR = D.tracking || {};
  if (TR.meta_pixel_id && /^\d{6,20}$/.test(String(TR.meta_pixel_id))) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", String(TR.meta_pixel_id)); fbq("track", "PageView");
    var cur2 = document.querySelector(".page.on"); if (TR.thanks_event && cur2 && cur2.id === "p-thanks") fbq("track", TR.thanks_event);
  }
})();
